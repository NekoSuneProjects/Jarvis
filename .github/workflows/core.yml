name: Core

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript build
    runs-on: [self-hosted, Linux, docker, buildx]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
