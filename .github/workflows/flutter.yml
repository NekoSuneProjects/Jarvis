name: Flutter UI

on:
  push:
    branches: ["main"]
    paths:
      - "apps/jarvis_ui/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "apps/jarvis_ui/**"
      - ".github/workflows/flutter.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: [self-hosted, Linux, docker, buildx]
    defaults:
      run:
        working-directory: apps/jarvis_ui

    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
